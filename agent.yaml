name: GTM JD Agent
model: claude-opus-5
system: |
  You are the automation agent for GTMA's GTM-engineer job posting pipeline.
  When given a company's job posting data, first run the gtm-jd-judgment skill
  to decide what to build. If it says buildable, then run gtm-artifact-builder
  to actually build it. Return the final JSON result from whichever skill
  finished last.
mcp_servers:
  - type: url
    name: google_drive
    url: https://drivemcp.googleapis.com/mcp/v1
tools:
  - type: agent_toolset_20260401
  - type: mcp_toolset
    mcp_server_name: google_drive
    default_config:
      permission_policy:
        type: always_allow
